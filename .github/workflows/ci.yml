name: ci

on:
  pull_request:
    branches: [ master ]
  push:
    branches:
      - master
      - develop

permissions:
  contents: read

jobs:

  lint:
    # ``ruff check`` and ``ruff format --check`` are the documented lint and
    # format steps (CONTRIBUTING.md, CLAUDE.md) but were never enforced
    # here, so the tree drifted.  ruff is pinned to a minor series in
    # requirements-test.txt because the formatter style and the stable rule
    # set both change across minor versions; the pin is read from there so
    # there is a single place to bump it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff (pinned in requirements-test.txt)
        run: pip install "$(grep -E '^ruff' requirements-test.txt)"
      - name: Lint
        run: ruff check src tests
      - name: Check formatting
        run: ruff format --check src tests

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Display Python version
        run: python -c "import sys; print(sys.version)"
      - name: Install test dependencies
        run: |
          pip install .
          pip install -r requirements-test.txt
      - name: Test with pytest
        run: pytest --cov=power_pptx --cov-report term-missing tests
      - name: Acceptance tests with behave
        run: behave --stop

  examples-lint:
    # Static-check examples/ for unused imports / undefined names so
    # PR review bots don't have to chase the same nits across every
    # example deck (IMPROVEMENT_PLAN item 16).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pyflakes
        run: pip install pyflakes
      - name: Static-check examples/
        run: pyflakes examples/

  examples-build:
    # Smoke-test the real-world deck suite end-to-end.  These ten
    # decks combine recipes, design tokens, charts, and the linter,
    # so a green build proves the public surface didn't regress.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install .
      - name: Build all real-world decks
        run: python examples/real_world/build_all.py

  docs:
    # The Sphinx guide is built with warnings as errors, the way
    # .readthedocs.yaml asks (``fail_on_warning: true``).  It had drifted to
    # 45 docstring errors and 3 warnings with nothing to notice, so keep it
    # at zero.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install documentation dependencies
        run: pip install -r requirements-docs.txt
      - name: Build the docs (warnings are errors)
        run: python -m sphinx -b html -W --keep-going docs docs/.build/html

  schema-validation:
    # Validate decks generated through the public API against the bundled
    # ISO/IEC 29500 XSD schemas.  This is the gate for the "generates fine but
    # PowerPoint reports the file as broken / repairs it" class of bug
    # (empty <a:scene3d>, colour-less shadows, negative chart axId, bare
    # <p14:morph>, dangling import_slide relationships, ...) that ordinary
    # "does it reopen" checks can't see.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          pip install .
          pip install -r requirements-test.txt
      - name: Validate generated decks against the OOXML schema
        run: pytest -v tests/schema
