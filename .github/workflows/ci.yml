name: ci

on:
  pull_request:
    branches: [ master ]
  push:
    branches:
      - master
      - develop

permissions:
  contents: read

# A newer push to the same pull request supersedes the run in progress.
# Runs on master are never cancelled: the release workflow waits for the
# CI result of the exact commit it is about to tag.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install '.[embedding]' -r requirements-quality.txt
      - name: Lint the source and tests with the full rule set
        run: ruff check src tests
      - name: Check the source and tests are formatted
        run: ruff format --check src tests
      - name: Keep every function's cognitive complexity at 15 or less
        run: complexipy
      - name: Check public entry point types
        run: pyright --project pyright-ci.json
      - name: Check release gate behavior
        run: node --test .github/scripts/require-ci.test.cjs

  html-embedding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install '.[embedding]' -r requirements-test.txt plotly
      - name: Install Chromium and browser dependencies
        run: python -m playwright install --with-deps chromium
      - name: Exercise styled HTML and SVG embedding
        run: >-
          pytest -v tests/integration/test_html_embedding.py tests/test_svg_picture.py
          tests/integration/test_hybrid_html.py
      - name: Build the styled HTML and native companion decks
        run: python examples/html_embedding/build.py --out-dir "$RUNNER_TEMP/html-embedding"

  render-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install rendering tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice-impress poppler-utils
      - run: pip install . -r requirements-test.txt
      - name: Exercise real LibreOffice rendering
        run: >-
          pytest -v tests/integration/test_render_libreoffice.py
          tests/integration/test_review.py

  modern-gallery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install rendering tools and the gallery fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice-impress poppler-utils fonts-dejavu-core
      - run: pip install '.[embedding]' -r requirements-test.txt matplotlib plotly
      - run: python -m playwright install --with-deps chromium
      - name: Build, validate, round-trip, and render all 32 gallery slides
        run: >-
          python examples/modern_gallery/build.py --render
          --out-dir "$RUNNER_TEMP/modern-gallery"
      - name: Exercise measured native, annotated hybrid, and browser figure workflows
        run: >-
          python examples/authoring_workflows/build.py
          --out-dir "$RUNNER_TEMP/authoring-workflows"
      - name: Keep rendered slides and validation evidence for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modern-gallery
          path: |
            ${{ runner.temp }}/modern-gallery
            ${{ runner.temp }}/authoring-workflows
          retention-days: 14

  build:
    runs-on: ubuntu-latest
    strategy:
      # Let every interpreter report, so one failure shows whether it is
      # version-specific.
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements*.txt
      - name: Display Python version
        run: python -c "import sys; print(sys.version)"
      - name: Install test dependencies
        run: |
          pip install .
          pip install -r requirements-test.txt
      - name: Test with pytest
        run: pytest --cov=power_pptx --cov-report term-missing tests
      - name: Acceptance tests with behave
        run: behave --stop

  lowest-deps:
    # Install the oldest dependency versions pyproject.toml allows, on the
    # oldest supported Python, and run the suites against them.  Without
    # this the declared floors drift: they once named releases that could
    # not even be installed on a supported interpreter.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Create a Python 3.10 environment
        run: uv venv --python 3.10
      - name: Install the package at its minimum dependency versions
        run: uv pip install --resolution lowest-direct .
      - name: Install the test tools without upgrading the runtime dependencies
        run: uv pip install -r requirements-test.txt
      - name: Show what was resolved
        run: uv pip list
      - name: Test with pytest
        run: .venv/bin/python -m pytest -q tests
      - name: Acceptance tests with behave
        run: .venv/bin/behave --stop

  docs:
    # Build the Sphinx documentation with warnings as errors, as Read the
    # Docs is configured to.  The build had been failing there unnoticed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-docs.txt
      - name: Build the documentation
        run: python -m sphinx -b html -W --keep-going docs "$RUNNER_TEMP/docs-html"

  examples-lint:
    # Static-check examples/ for unused imports / undefined names so
    # PR review bots don't have to chase the same nits across every
    # example deck (IMPROVEMENT_PLAN item 16).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pyflakes
        run: pip install pyflakes
      - name: Static-check examples/
        run: pyflakes examples/

  examples-build:
    # Smoke-test the real-world deck suite end-to-end.  These ten
    # decks combine recipes, design tokens, charts, and the linter,
    # so a green build proves the public surface didn't regress.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install .
      - name: Build all real-world decks
        run: python examples/real_world/build_all.py

  schema-validation:
    # Validate decks generated through the public API against the bundled
    # ISO/IEC 29500 XSD schemas.  This is the gate for the "generates fine but
    # PowerPoint reports the file as broken / repairs it" class of bug
    # (empty <a:scene3d>, colour-less shadows, negative chart axId, bare
    # <p14:morph>, dangling import_slide relationships, ...) that ordinary
    # "does it reopen" checks can't see.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          pip install .
          pip install -r requirements-test.txt
      - name: Validate generated decks against the OOXML schema
        run: pytest -v tests/schema
