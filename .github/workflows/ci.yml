name: ci

on:
  pull_request:
    branches: [ master ]
  push:
    branches:
      - master
      - develop

permissions:
  contents: read

jobs:

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install '.[embedding]' -r requirements-quality.txt
      - name: Check correctness rules throughout the source and tests
        run: ruff check --select E9,F63,F7,F82 src tests
      - name: Check maintained authoring and validation modules
        run: >-
          ruff check src/power_pptx/audit.py src/power_pptx/render.py
          src/power_pptx/compose/from_spec.py src/power_pptx/text/layout.py
          src/power_pptx/text/text.py src/power_pptx/lint.py
          tests/test_reliability.py tests/integration/test_render_libreoffice.py
          src/power_pptx/design/figures.py src/power_pptx/design/_html.py
          src/power_pptx/compose/from_html.py src/power_pptx/_svg.py
          tests/design/test_html_capture.py tests/integration/test_html_embedding.py
          src/power_pptx/design/containers.py src/power_pptx/text/measurement.py
          src/power_pptx/compose/_hybrid.py src/power_pptx/design/_html_layers.py
          src/power_pptx/validation.py src/power_pptx/review.py src/power_pptx/_schema.py
          src/power_pptx/__main__.py tests/design/test_containers.py
          tests/text/test_constraints.py tests/test_validation.py
          tests/integration/test_hybrid_html.py tests/integration/test_review.py
      - name: Check public entry point types
        run: pyright --project pyright-ci.json
      - name: Check release gate behavior
        run: node --test .github/scripts/require-ci.test.cjs

  html-embedding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install '.[embedding]' -r requirements-test.txt plotly
      - name: Install Chromium and browser dependencies
        run: python -m playwright install --with-deps chromium
      - name: Exercise styled HTML and SVG embedding
        run: >-
          pytest -v tests/integration/test_html_embedding.py tests/test_svg_picture.py
          tests/integration/test_hybrid_html.py
      - name: Build the styled HTML and native companion decks
        run: python examples/html_embedding/build.py --out-dir "$RUNNER_TEMP/html-embedding"

  render-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install rendering tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice-impress poppler-utils
      - run: pip install . -r requirements-test.txt
      - name: Exercise real LibreOffice rendering
        run: >-
          pytest -v tests/integration/test_render_libreoffice.py
          tests/integration/test_review.py

  modern-gallery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install rendering tools and the gallery fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice-impress poppler-utils fonts-dejavu-core
      - run: pip install '.[embedding]' -r requirements-test.txt matplotlib plotly
      - run: python -m playwright install --with-deps chromium
      - name: Build, validate, round-trip, and render all 32 gallery slides
        run: >-
          python examples/modern_gallery/build.py --render
          --out-dir "$RUNNER_TEMP/modern-gallery"
      - name: Exercise measured native, annotated hybrid, and browser figure workflows
        run: >-
          python examples/authoring_workflows/build.py
          --out-dir "$RUNNER_TEMP/authoring-workflows"
      - name: Keep rendered slides and validation evidence for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modern-gallery
          path: |
            ${{ runner.temp }}/modern-gallery
            ${{ runner.temp }}/authoring-workflows
          retention-days: 14

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Display Python version
        run: python -c "import sys; print(sys.version)"
      - name: Install test dependencies
        run: |
          pip install .
          pip install -r requirements-test.txt
      - name: Test with pytest
        run: pytest --cov=power_pptx --cov-report term-missing tests
      - name: Acceptance tests with behave
        run: behave --stop

  examples-lint:
    # Static-check examples/ for unused imports / undefined names so
    # PR review bots don't have to chase the same nits across every
    # example deck (IMPROVEMENT_PLAN item 16).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pyflakes
        run: pip install pyflakes
      - name: Static-check examples/
        run: pyflakes examples/

  examples-build:
    # Smoke-test the real-world deck suite end-to-end.  These ten
    # decks combine recipes, design tokens, charts, and the linter,
    # so a green build proves the public surface didn't regress.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install .
      - name: Build all real-world decks
        run: python examples/real_world/build_all.py

  schema-validation:
    # Validate decks generated through the public API against the bundled
    # ISO/IEC 29500 XSD schemas.  This is the gate for the "generates fine but
    # PowerPoint reports the file as broken / repairs it" class of bug
    # (empty <a:scene3d>, colour-less shadows, negative chart axId, bare
    # <p14:morph>, dangling import_slide relationships, ...) that ordinary
    # "does it reopen" checks can't see.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          pip install .
          pip install -r requirements-test.txt
      - name: Validate generated decks against the OOXML schema
        run: pytest -v tests/schema
