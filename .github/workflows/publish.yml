name: publish

# NOTE ON TRIGGERS
#
# ``release-on-version-bump`` creates the ``vX.Y.Z`` tag and the GitHub
# release using the default ``GITHUB_TOKEN``.  GitHub deliberately does
# **not** start new workflow runs from events raised with that token
# (the documented anti-recursion rule), so neither the ``push: tags``
# nor the ``release: published`` trigger below ever fires for an
# automated release — which is why every publish in this repo's history
# was a manual ``workflow_dispatch``.
#
# ``workflow_run`` is not subject to that restriction: it fires on the
# *completion of a workflow*, not on a token-raised event.  It also
# keeps this file as the run's entrypoint workflow, which matters
# because PyPI Trusted Publishing matches on the entrypoint workflow
# filename — calling this workflow from the other one via
# ``workflow_call`` would change that claim and break the upload.
#
# The two original triggers are kept for tags pushed by a human.
on:
  push:
    tags:
      - "v*"
  release:
    types: [published]
  workflow_run:
    workflows: ["release-on-version-bump"]
    types: [completed]
  workflow_dispatch:

jobs:
  # A workflow_run start says only "the release workflow finished", not
  # "it cut a release".  That workflow succeeds as a no-op when
  # ``__version__`` already matches a tag, so an ordinary master push
  # after a release would otherwise start a second publish from the
  # *later* commit — building the released version number out of code the
  # tag does not point at, and racing the real release's upload while the
  # index is still empty.  ``--check-url`` cannot close that: it skips
  # files that already exist, which is neither atomic nor proof of
  # provenance.
  #
  # So gate on the tag itself: publish only when ``v$__version__``
  # resolves to exactly the commit being built.  That is true for the
  # release run that just cut the tag and false for every later no-op.
  guard:
    name: Confirm the version tag points at this commit
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.check.outputs.publish }}
    if: >-
      github.event_name != 'workflow_run'
      || (github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.head_branch == 'master')
    steps:
      - uses: actions/checkout@v4
        with:
          # Tags are needed to resolve the version tag; a shallow clone
          # has no tag refs.
          fetch-depth: 0
          ref: >-
            ${{ github.event_name == 'workflow_run'
                && github.event.workflow_run.head_sha
                || github.ref }}

      - name: Check the version tag against this commit
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "workflow_run" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "$EVENT_NAME start — publishing as before."
            exit 0
          fi
          version=$(python -c "import re; print(re.search(r'__version__\s*=\s*[\"\']([^\"\']+)[\"\']', open('src/power_pptx/__init__.py').read()).group(1))")
          tag="v$version"
          if ! tagged=$(git rev-parse -q --verify "refs/tags/$tag^{commit}"); then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "No $tag tag — the release workflow cut nothing. Skipping."
            exit 0
          fi
          if [ "$tagged" != "$HEAD_SHA" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "$tag points at $tagged, not the commit being built ($HEAD_SHA)."
            echo "This run carried no version bump. Skipping."
            exit 0
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "$tag == $HEAD_SHA — this run cut the release. Publishing."

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: guard
    if: needs.guard.outputs.publish == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run checks out the default branch by default; pin to
          # the commit the release was actually cut from.
          ref: >-
            ${{ github.event_name == 'workflow_run'
                && github.event.workflow_run.head_sha
                || github.ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Build sdist and wheel
        run: uv build

      - name: Check distribution metadata
        run: |
          uv tool run --from twine twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    name: Publish to PyPI
    needs: [guard, build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/power-pptx
    permissions:
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Publish to PyPI
        # ``--check-url`` skips files the index already has instead of
        # failing the run.  The ``guard`` job is what keeps an unreleased
        # commit from ever being built under a released version number;
        # this only keeps a re-run or a manual dispatch of an
        # already-published version from failing.
        run: |
          uv publish --trusted-publishing always \
            --check-url https://pypi.org/simple/power-pptx/
